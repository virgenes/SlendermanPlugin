name: SlendermanPlugin
version: '2.0.0'
main: me.dreamdevs.slender.SlenderMain
author: virgenes
api-version: '1.16'
description: Professional horror minigame with multiple game modes

commands:
  sis:
    aliases: [slender, slenderman, slendermanplugin]
    description: Main Slender command
    usage: /sis <subcommand>
  party:
    aliases: [slenderparty]
    description: Party system command
    usage: /party <subcommand>
  sisadmin:
    description: Admin commands for Slender
    usage: /sisadmin <subcommand>
    permission: slender.admin

permissions:
  slender.*:
    description: All Slender permissions
    children:
      slender.admin: true
      slender.play: true
  slender.admin:
    description: Admin permissions
    default: op
  slender.play:
    description: Play permissions
    default: true