# ╔══════════════════════════════════════════════════════════════╗
# ║              SlendermanPlugin — Configuration File              ║
# ║                                                              ║
# ║  Supported versions: Paper/Spigot 1.19 – 1.21.x             ║
# ║  GitHub: https://github.com/virgenes/SlendermanPlugin          ║
# ╚══════════════════════════════════════════════════════════════╝

# ── General ────────────────────────────────────────────────────────────────
General:
  # Language for all player-facing messages.
  # Available: en, es, fr, de, pt, zh
  # Custom files can be placed in plugins/SlendermanPlugin/lang/<code>.yml
  Language: en

  # Prefix shown in console messages (not in-game messages).
  Prefix: "&8[&cSlender&8] &r"

  # Check for plugin updates on startup.
  Update-Checker: true

# ── Game Settings ───────────────────────────────────────────────────────────
GameSettings:
  # Number of pages survivors must collect to win.
  Pages-To-Win: 8

  # SlenderMan's maximum health (hearts × 2).
  # Default: 40 = 20 hearts
  SlenderMan-Health: 40

  # Countdown (seconds) before the game starts after minimum players join.
  Starting-Countdown: 30

  # Countdown (seconds) after the game ends before returning to lobby.
  Ending-Timer: 15

  # Delay (ticks, 20 ticks = 1 second) before the arena resets to WAITING.
  Restart-Delay-Ticks: 100

  # ── Torch Settings ──────────────────────────────────────────────────────
  Torch:
    # Maximum number of torch uses per game session per survivor.
    Max-Uses: 3

    # Cooldown in seconds between torch uses.
    Cooldown-Seconds: 5

    # Duration (ticks) of Night Vision granted by a torch.
    Night-Vision-Ticks: 100

  # ── Atmosphere Effects ──────────────────────────────────────────────────
  Atmosphere:
    # Apply DARKNESS effect to survivors periodically.
    # On servers below 1.19, BLINDNESS is used instead automatically.
    Use-Darkness-Effect: true

    # How often (seconds) to reapply the darkness effect.
    Darkness-Reapply-Interval-Seconds: 3

    # Duration (ticks) of each darkness application.
    Darkness-Duration-Ticks: 80

  # ── Terror Radius ───────────────────────────────────────────────────────
  TerrorRadius:
    # Enable proximity effects (music + nausea) near the SlenderMan.
    Enabled: true

    # Radius (blocks) at which scary ambient music plays.
    Music-Radius: 7.00

    # Radius (blocks) at which survivors get nausea.
    # Must be <= Music-Radius
    Nausea-Radius: 3.00

    # Duration (ticks) of the nausea effect.
    Nausea-Duration-Ticks: 60

    # Amplifier of the nausea effect (0 = level 1, 1 = level 2).
    Nausea-Amplifier: 1

  # ── Disguise / Skins ────────────────────────────────────────────────────
  Disguise:
    # Enable the internal disguise system for the SlenderMan.
    # When disabled, the SlenderMan appears as a normal player.
    Enabled: true

    # Default skin applied to the SlenderMan at game start.
    # Options: ENDERMAN, WITHER, PHANTOM, RAVAGER, ELDER_GUARDIAN, WARDEN
    # Note: PHANTOM requires 1.13+, RAVAGER requires 1.14+, WARDEN requires 1.19+
    # If the skin is unavailable on your server version, ENDERMAN is used.
    Default-Skin: ENDERMAN

  # ── Starting Items ──────────────────────────────────────────────────────
  Items:
    # Material for the survivor's weapon.
    # Must be a valid Bukkit Material name.
    Survivor-Weapon: WOODEN_SWORD

    # Material for the SlenderMan's weapon.
    SlenderMan-Weapon: IRON_SWORD

  # ── Party System ────────────────────────────────────────────────────────
  Party:
    # Enable the party system.
    Enabled: true

    # Maximum members per party (including the leader).
    Max-Members: 4

# ── Lobby Items ─────────────────────────────────────────────────────────────
# Materials for items given to players in the lobby.
# Must be valid Bukkit Material names.
LobbyItems:
  Arena-Selector: CHEST
  Leave: RED_BED
  My-Profile: PLAYER_HEAD
  Play-Again: PAPER
  Party-Menu: SLIME_BALL
  Shop: GOLD_INGOT
  Spectator-Settings: STICK
  Spectator-Teleporter: COMPASS

# ── Perk Settings ───────────────────────────────────────────────────────────
Perks:
  Runaway:
    # Cooldown in seconds before the perk can be used again.
    Cooldown-Seconds: 20
    # Duration (ticks) of the Speed II effect.
    Duration-Ticks: 100

  BetterTogether:
    Cooldown-Seconds: 25
    # Radius (blocks) to search for nearby allies.
    Radius-Blocks: 8.00

  Archaeologist:
    Cooldown-Seconds: 30
    # Duration (ticks) of Night Vision granted.
    Night-Vision-Ticks: 160

# ── Database ────────────────────────────────────────────────────────────────
Database:
  # Storage type: YAML (file-based, no setup needed) or MYSQL
  Type: YAML

  # Auto-save interval in seconds (0 = disabled).
  Auto-Save: 300

  # MySQL settings (only used when Type: MYSQL)
  Host: localhost
  Port: 3306
  Name: slender
  User: root
  Password: password

# ── Economy System ───────────────────────────────────────────────────────────
Economy:
  # Enable economy integration
  Enabled: true

  # Starting coins for new players
  Starting-Coins: 100.00

  # Reward for winning a game
  Win-Reward: 500.00

  # Reward for finding a page
  Page-Reward: 50.00

  # Cost to join a game
  Join-Cost: 10.00

