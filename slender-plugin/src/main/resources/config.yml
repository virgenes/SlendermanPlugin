# ── Statistics ───────────────────────────────────────────────────────────────
Statistics:
  # Enable statistics tracking
  Enabled: true

  # Types of statistics to track
  Tracked-Stats:
    - "games_played"
    - "games_won"
    - "pages_found"
    - "time_played"
    - "deaths"
    - "kills"
    - "coins_earned"
    - "distance_traveled"

  # Leaderboard settings
  Leaderboard:
    Enabled: true
    Update-Interval: 300
    Max-Entries: 10

# ── Performance ───────────────────────────────────────────────────────────
Performance:
  # Maximum entities per arena
  Max-Entities-Per-Arena: 100

  # Cleanup interval for inactive entities (seconds)
  Entity-Cleanup-Interval: 60

  # Maximum memory usage threshold (MB)
  Memory-Threshold: 512

  # Enable performance monitoring
  Monitoring-Enabled: true

# ── Security ───────────────────────────────────────────────────────────────
Security:
  # Anti-cheat measures
  Anti-Cheat:
    Enabled: true
    Max-Actions-Per-Second: 10
    Ban-On-Violation: true

  # Chat filter
  Chat-Filter:
    Enabled: true
    Blocked-Words:
      - "hack"
      - "cheat"
      - "exploit"

# ── Localization ───────────────────────────────────────────────────────────
Localization:
  # Auto-detect player language
  Auto-Detect: true

  # Fallback language if detection fails
  Fallback-Language: "en"

  # Available languages
  Available:
    - "en"
    - "es"
    - "fr"
    - "de"
    - "pt"
    - "zh"

# ── Notifications ───────────────────────────────────────────────────────────
Notifications:
  # Enable notifications
  Enabled: true

  # Types of notifications
  Types:
    Game-Start: true
    Game-End: true
    Page-Found: true
    Player-Join: true
    Player-Leave: true
    Level-Up: true
    Achievement: true

  # Notification sound
  Sound: "ENTITY_EXPERIENCE_ORB_PICKUP"

# ── Debug Settings ─────────────────────────────────────────────────────────
Debug:
  # Enable debug mode
  Enabled: false

  # Log level (FINE, INFO, WARNING, SEVERE)
  Log-Level: "INFO"

  # Save debug logs to file
  Save-To-File: false

# ── Advanced Settings ─────────────────────────────────────────────────────
Advanced:
  # Multi-world support
  Multi-World:
    Enabled: true
    Allowed-Worlds:
      - "world"
      - "world_nether"
      - "world_the_end"

  # Plugin compatibility
  Compatibility:
    PlaceholderAPI: true
    Vault: true
    WorldEdit: true
    WorldGuard: true

  # Custom game modes
  Custom-Modes:
    Enabled: false
    Modes: []
